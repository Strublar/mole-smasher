name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run build script
        run: npm run build
      
      - name: Run linting (if configured)
        run: npm run lint --if-present
      
      - name: Run tests
        run: npm test

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify HTML5 structure
        run: |
          if grep -q '<canvas' index.html; then
            echo "✓ Canvas element found in index.html"
          else
            echo "✗ Canvas element missing from index.html"
            exit 1
          fi
      
      - name: Check for critical files
        run: |
          files=("index.html" "styles/style.css" "src/game.js" "js/mole.js" "js/grid.js")
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ Found: $file"
            else
              echo "✗ Missing: $file"
              exit 1
            fi
          done
      
      - name: Verify asset files
        run: |
          assets=("assets/images/mole.svg" "assets/images/hole.svg")
          for asset in "${assets[@]}"; do
            if [ -f "$asset" ]; then
              echo "✓ Found: $asset"
            else
              echo "✗ Missing: $asset"
              exit 1
            fi
          done

  browser-compatibility:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate JavaScript syntax
        run: |
          for js_file in src/*.js js/*.js; do
            if [ -f "$js_file" ]; then
              echo "Checking syntax: $js_file"
              node --check "$js_file" || exit 1
            fi
          done
