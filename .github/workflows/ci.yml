name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build script
        run: npm run build

      - name: Validate project structure
        run: |
          # Check essential files exist
          test -f "index.html" || (echo "❌ index.html not found" && exit 1)
          test -f "src/game.js" || (echo "❌ src/game.js not found" && exit 1)
          test -f "styles/style.css" || (echo "❌ styles/style.css not found" && exit 1)
          test -f "js/gameLogic.js" || (echo "❌ js/gameLogic.js not found" && exit 1)
          test -f "js/timer.js" || (echo "❌ js/timer.js not found" && exit 1)
          echo "✅ All essential files present"

      - name: Validate HTML structure
        run: |
          # Basic HTML validation - check for canvas element
          if grep -q "<canvas" index.html; then
            echo "✅ Canvas element found in index.html"
          else
            echo "❌ Canvas element not found in index.html"
            exit 1
          fi

      - name: Check JavaScript syntax
        run: |
          # Validate JavaScript syntax with Node.js
          for file in src/game.js js/gameLogic.js js/timer.js js/mole.js js/grid.js; do
            if [ -f "$file" ]; then
              node -c "$file" && echo "✅ $file syntax valid" || (echo "❌ Syntax error in $file" && exit 1)
            fi
          done

      - name: Validate code style
        run: |
          # Basic code style checks
          echo "🔍 Checking code style guidelines..."
          
          # Check for console.log in production files (warnings)
          for file in src/game.js js/gameLogic.js js/timer.js; do
            if [ -f "$file" ]; then
              if grep -q "console\.log" "$file"; then
                echo "⚠️  Warning: console.log found in $file (should be removed for production)"
              fi
            fi
          done
          
          echo "✅ Code style validation complete"

      - name: Test game initialization
        run: |
          # Verify critical game components exist in gameLogic.js
          echo "🧪 Verifying game logic components..."
          
          if grep -q "const\|class" js/gameLogic.js; then
            echo "✅ Game logic exports detected"
          else
            echo "⚠️  Game logic structure may be incomplete"
          fi
          
          if grep -q "const\|class" js/timer.js; then
            echo "✅ Timer logic exports detected"
          else
            echo "⚠️  Timer logic structure may be incomplete"
          fi

      - name: Build summary
        if: always()
        run: |
          echo "======================================"
          echo "  Mole Smasher CI Build Summary"
          echo "======================================"
          echo "✅ Repository structure validated"
          echo "✅ HTML5 Canvas detected"
          echo "✅ JavaScript syntax validated"
          echo "✅ Game components verified"
          echo ""
          echo "Stack: HTML5 Canvas + Vanilla JavaScript (ES6+)"
          echo "Status: Ready for deployment"
          echo "======================================"
