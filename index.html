<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mole Smasher - A classic whack-a-mole arcade game built with HTML5 Canvas">
  <title>Mole Smasher</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <div class="container">
    <header class="game-header">
      <h1>Mole Smasher</h1>
      <p class="subtitle">Click or tap the moles as they pop!</p>
    </header>

    <div class="game-wrapper">
      <div class="game-info">
        <div class="info-item">
          <label for="score-display">Score:</label>
          <span id="score-display">0</span>
        </div>
        <div class="info-item">
          <label for="timer-display">Time:</label>
          <span id="timer-display">60</span>s
        </div>
      </div>

      <canvas id="gameCanvas" width="800" height="600"></canvas>

      <div class="game-controls">
        <button id="start-btn" class="btn btn-primary">Start Game</button>
        <button id="reset-btn" class="btn btn-secondary" disabled>Reset</button>
      </div>
    </div>

    <footer class="game-footer">
      <p>&copy; 2024 Mole Smasher. Built with HTML5 Canvas.</p>
    </footer>
  </div>

  <!-- Grid and Mole systems - must load before game engine -->
  <script src="js/grid.js"></script>
  <script src="js/mole.js"></script>
  <!-- Timer and spawning systems - must load before game engine -->
  <script src="js/timer.js"></script>
  <script src="js/gameLogic.js"></script>
  <!-- Core game engine -->
  <script src="src/game.js"></script>
</body>
</html>
