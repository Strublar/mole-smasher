<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mole Smasher - A classic whack-a-mole arcade game">
  <title>Mole Smasher</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <div class="container">
    <header class="game-header">
      <h1>Mole Smasher</h1>
      <p class="subtitle">Click or tap the moles as they pop!</p>
    </header>

    <div class="game-wrapper">
      <div class="game-info">
        <div class="info-item">
          <label>Score:</label>
          <span id="score-value">0</span>
        </div>
      </div>

      <div id="board" aria-label="Game board"></div>

      <div class="game-controls">
        <button id="btn-start" class="btn btn-primary">Start Game</button>
        <button id="btn-pause" class="btn btn-secondary" disabled>Pause</button>
      </div>
    </div>

    <footer class="game-footer">
      <p>&copy; 2024 Mole Smasher. Built with HTML5.</p>
    </footer>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
